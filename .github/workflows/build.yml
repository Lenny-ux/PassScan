name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: PassScan
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen et ldid
        run: brew install xcodegen ldid

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler (sans signature)
        run: |
          set -o pipefail
          xcodebuild \
            -project PassScan.xcodeproj \
            -scheme PassScan \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 80

      - name: Créer le .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/PassScan.app
          ldid -SConfig/PassScan.entitlements "$APP/PassScan"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry PassScan.ipa Payload

      - name: Envoyer l'ipa dans Actions
        uses: actions/upload-artifact@v4
        with:
          name: PassScan-ipa
          path: PassScan/PassScan.ipa

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PassScan (build ${{ github.run_number }})
          files: PassScan/PassScan.ipa
